name: Build Book Splitter APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project
        run: |
          rm -rf extracted
          unzip -q BookSplitter-Android-Source.zip -d extracted
          test -f extracted/BookSplitter/gradlew

      - name: Use stable Android SDK 36
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' extracted/BookSplitter/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' extracted/BookSplitter/app/build.gradle.kts

      - name: Test and build APK
        working-directory: extracted/BookSplitter
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spittler-debug-APK
          path: extracted/BookSplitter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spittler-debug-APK
          path: extracted/BookSplitter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
