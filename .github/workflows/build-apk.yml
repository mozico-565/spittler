name: Build Book Splitter APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Extract project
        run: |
          unzip -q BookSplitter-Android-Source.zip -d extracted
          test -f extracted/BookSplitter/gradlew

      - name: Test and build APK
        run: |
          cd extracted/BookSplitter
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Spittler-debug-APK
          path: extracted/BookSplitter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error